
services:
  postgres-db:
    image: postgres:16-alpine
    container_name: lingua-postgres-db
    restart: unless-stopped
    env_file:
      - ./database.env
    ports:
      - "5432:5432"
      
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lingua-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: lingua-pgadmin
    restart: unless-stopped
    env_file:
      - ./database.env
    ports:
      - "5050:80"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - lingua-network

volumes:
  pgdata:

networks:
  lingua-network:
    name: lingua-network
    driver: bridge